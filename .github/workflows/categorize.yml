name: Categorize YNAB Transactions

on:
  schedule:
    - cron: "0 * * * *" # every hour on the hour (UTC)
  workflow_dispatch: # allows manual runs from GitHub

jobs:
  categorize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run categorize.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YNAB_API_TOKEN: ${{ secrets.YNAB_API_TOKEN }}
          YNAB_BUDGET_ID: ${{ secrets.YNAB_BUDGET_ID }}
        run: python categorize.py $YNAB_BUDGET_ID
